<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Mañanas & Pausas Conscientes</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para procesar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap');
    body { font-family: 'Montserrat', sans-serif; }
    h1, h2, h3 { font-family: 'Merriweather', serif; }
  </style>
</head>
<body class="bg-[#E3D9CC]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AppVolverAVos() {
      const [tab, setTab] = useState('mañana');
      const [level, setLevel] = useState(5);
      const [gratitude, setGratitude] = useState(['', '', '']);
      const [saved, setSaved] = useState(false);

      useEffect(() => {
        const savedData = localStorage.getItem('volver_a_vos_gratitude');
        if (savedData) {
          try { setGratitude(JSON.parse(savedData)); } catch(e){}
        }
      }, []);

      const handleSave = () => {
        localStorage.setItem('volver_a_vos_gratitude', JSON.stringify(gratitude));
        setSaved(true);
        setTimeout(() => setSaved(false), 3000);
      };

      return (
        <div className="min-h-screen bg-[#E3D9CC] text-gray-800 pb-12">
          <header className="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-[#8DB896]/30 px-6 py-4 flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold text-[#E8823D]">Volver a Vos</h1>
              <p className="text-xs text-[#8DB896] font-medium">App Mañanas & Pausas Conscientes · A tu ritmo</p>
            </div>
          </header>

          <main className="max-w-md mx-auto px-4 pt-6 space-y-6">
            <div className="bg-white rounded-2xl p-1.5 shadow-sm border border-[#E3D9CC] flex justify-between">
              <button 
                onClick={() => setTab('mañana')}
                className={`flex-1 py-2.5 rounded-xl text-xs font-semibold ${tab === 'mañana' ? 'bg-[#E8823D] text-white' : 'text-gray-600'}`}
              >
                🌅 Mañana
              </button>
              <button 
                onClick={() => setTab('pausa')}
                className={`flex-1 py-2.5 rounded-xl text-xs font-semibold ${tab === 'pausa' ? 'bg-[#8DB896] text-white' : 'text-gray-600'}`}
              >
                ☕ Pausa SOS
              </button>
              <button 
                onClick={() => setTab('noche')}
                className={`flex-1 py-2.5 rounded-xl text-xs font-semibold ${tab === 'noche' ? 'bg-[#9D7CB8] text-white' : 'text-gray-600'}`}
              >
                🌙 Noche
              </button>
            </div>

            {tab === 'mañana' && (
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#8DB896]/20 space-y-4">
                <h2 className="font-bold text-lg text-gray-800">Elegí tu versión de hoy</h2>
                <p className="text-xs text-gray-500">No importa la hora, importa no soltarte de vos.</p>
                <div className="grid grid-cols-3 gap-2">
                  {[5, 10, 20].map((m) => (
                    <button
                      key={m}
                      onClick={() => setLevel(m)}
                      className={`py-2 rounded-xl text-xs font-bold border ${level === m ? 'border-[#E8823D] bg-[#E8823D]/10 text-[#E8823D]' : 'border-gray-200 text-gray-500'}`}
                    >
                      {m} Min
                    </button>
                  ))}
                </div>
                <div className="bg-[#E3D9CC]/40 rounded-xl p-4 text-xs space-y-2">
                  {level === 5 && <p>⚡ <strong>5 min:</strong> Pies en el piso, 3 respiraciones profundas, 1 vaso de agua y 1 intención.</p>}
                  {level === 10 && <p>🌱 <strong>10 min:</strong> Todo lo de 5 min + 3 min de estiramiento suave + 3 agradecimientos.</p>}
                  {level === 20 && <p>✨ <strong>20 min:</strong> Todo lo de 10 min + 10 min de movimiento o caminata consciente.</p>}
                </div>
              </div>
            )}

            {tab === 'pausa' && (
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#8DB896]/20 text-center space-y-4">
                <h2 className="font-bold text-xl text-gray-800">Respiración 4 y 6</h2>
                <p className="text-xs text-gray-500">Inhalá por la nariz en 4 segundos y exhalá por la boca en 6 segundos para apagar el modo alerta.</p>
                <div className="py-6">
                  <div className="w-28 h-28 rounded-full bg-[#8DB896]/20 border-4 border-[#8DB896] mx-auto flex items-center justify-center font-bold text-lg text-[#8DB896]">
                    4s / 6s
                  </div>
                </div>
              </div>
            )}

            {tab === 'noche' && (
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#9D7CB8]/20 space-y-4">
                <h2 className="font-bold text-lg text-gray-800">Mi Diario de Gratitud</h2>
                <div className="space-y-2">
                  {gratitude.map((item, idx) => (
                    <input
                      key={idx}
                      type="text"
                      placeholder={`Gracias por (${idx + 1})...`}
                      value={item}
                      onChange={(e) => {
                        const newG = [...gratitude];
                        newG[idx] = e.target.value;
                        setGratitude(newG);
                      }}
                      className="w-full text-xs p-3 rounded-xl border border-gray-200 bg-gray-50/50"
                    />
                  ))}
                </div>
                <button
                  onClick={handleSave}
                  className="w-full py-3 bg-[#9D7CB8] text-white rounded-xl font-bold text-xs shadow-sm"
                >
                  {saved ? '¡Guardado en tu celular!' : 'Guardar mis notas'}
                </button>
              </div>
            )}

            <div className="bg-gradient-to-r from-[#E8823D] to-[#9D7CB8] text-white p-5 rounded-2xl shadow-md text-left space-y-2">
              <h3 className="font-bold text-base">¿Querés hacer esto en vivo con Jime?</h3>
              <p className="text-xs opacity-90">Sumate al Club Volver a Vos y encontrémonos todas las mañanas por Zoom.</p>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.render(<AppVolverAVos />, document.getElementById('root'));
  </script>
</body>
</html>
